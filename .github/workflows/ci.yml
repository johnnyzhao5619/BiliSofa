name: TV candidate and foundation checks
# Manual only: this project verifies locally (npm run check, npm test, native and UI suites); pushes and PRs never start it.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 verified 2026-10-14
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 verified 2026-10-14
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm run test:native:http
      - run: npm run test:native:media
      - run: npm run test:native:stop
      - run: npm run build
      - run: npm run package
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - run: python3 tools/verify-package.py
      - run: npm run build:foundation
      - run: npm run test:ui:foundation
      - run: npm run package:foundation-preview
      - run: npm run build:app
      - run: npm run test:ui:queue
      - run: npm run test:ui:follow-updates
      - run: npm run test:ui:favorites
      - run: npm run test:ui:history
      - run: npm run test:ui:library
      - run: npm run test:ui:app
      - run: npm run test:ui:search
      - run: npm run test:ui:catalog
      - run: npm run test:ui:media
      - run: npm run test:ui:cast-app
      - run: npm run test:ui:local-app
      - run: npm run build:app:w04
      - run: npm run test:ui:w04-media
# No signing profiles, account writes, installation or release actions in CI.
